---
# Two-router BGP chain, client stage.
# This client is LAN-only behind router-test-2 on net-test2 / bridge1002.
router_lab_hypervisor_host: ronny-1
router_lab_vms:
  - hostname: router-peer-1
    primary_bridge: bridge1002
    management_mac: 52:54:00:e6:22:e8
    cloud_init_networks:
      - name: lan
        match_mac: 52:54:00:e6:22:e8
        set_name: lan
        dhcp4: true
        optional: true
    extra_nics: []
