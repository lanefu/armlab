---
# Two-router BGP chain, router stage:
# primary router -> router-test-1 -> router-test-2.
# Provision the routers first, then configure them with clammy-ng before adding
# the LAN-only client behind router-test-2.
router_lab_hypervisor_host: ronny-1
router_lab_vms:
  - hostname: router-test-1
    primary_bridge: bridge0
    management_mac: 52:58:00:54:b0:ab
    cloud_init_networks:
      - name: wan
        match_mac: 52:58:00:54:b0:ab
        set_name: wan
        addresses:
          - "{{ router_lab_management_address }}/24"
        gateway4: "{{ router_lab_management_gateway }}"
        nameservers: "{{ router_lab_dns_nameservers }}"
      - name: transit
        match_mac: 52:54:00:e6:22:c8
        set_name: transit
        addresses:
          - 192.168.100.1/24
        optional: true
      - name: lan
        match_mac: 52:54:00:e6:22:c7
        set_name: lan
        addresses:
          - 192.168.103.1/24
        optional: true
      - name: primary
        match_mac: 52:54:00:e6:22:c9
        set_name: primary
        addresses:
          - 192.168.101.2/24
        optional: true
    extra_nics:
      - bridge: bridge1001
        mac_address: 52:54:00:e6:22:c9
      - bridge: bridge1004
        mac_address: 52:54:00:e6:22:c7
      - bridge: bridge1005
        mac_address: 52:54:00:e6:22:c8
  - hostname: router-test-2
    primary_bridge: bridge0
    management_mac: 52:58:00:54:b0:ac
    cloud_init_networks:
      - name: wan
        match_mac: 52:58:00:54:b0:ac
        set_name: wan
        addresses:
          - 172.17.20.91/24
        gateway4: "{{ router_lab_management_gateway }}"
        nameservers: "{{ router_lab_dns_nameservers }}"
      - name: transit
        match_mac: 52:54:00:e6:22:d8
        set_name: transit
        addresses:
          - 192.168.100.2/24
        optional: true
      - name: lan
        match_mac: 52:54:00:e6:22:d9
        set_name: lan
        addresses:
          - 192.168.102.1/24
        optional: true
    extra_nics:
      - bridge: bridge1005
        mac_address: 52:54:00:e6:22:d8
      - bridge: bridge1002
        mac_address: 52:54:00:e6:22:d9
