---
# Router-to-router lab topology:
# - router-test-1 serves the first LAN and the downstream DHCP client path
# - router-test-2 joins the transit link and serves a second LAN
# - router-peer-1 is the DHCP client on router-test-1's LAN
# NetBox design:
# - tenant: lane
# - net-test0 / VLAN 1000: transit between router-test-1 and router-test-2
# - net-test1 / VLAN 1001: primary-router test transit
# - net-test2 / VLAN 1002: router-test-2 LAN
router_lab_hypervisor_host: ronny-1
router_lab_vms:
  - hostname: router-test-1
    primary_bridge: bridge0
    management_mac: 52:58:00:54:b0:ab
    cloud_init_networks:
      - name: wan
        match_mac: 52:58:00:54:b0:ab
        set_name: wan
        addresses:
          - "{{ router_lab_management_address }}/24"
        gateway4: "{{ router_lab_management_gateway }}"
      - name: lan
        match_mac: 52:54:00:e6:22:c7
        set_name: lan
        addresses:
          - 192.168.103.1/24
        optional: true
      - name: transit
        match_mac: 52:54:00:e6:22:c8
        set_name: transit
        addresses:
          - 192.168.100.1/24
        optional: true
      - name: primary
        match_mac: 52:54:00:e6:22:c9
        set_name: primary
        addresses:
          - 192.168.101.2/24
        optional: true
    extra_nics:
      - bridge: bridge1001
        mac_address: 52:54:00:e6:22:c9
      - bridge: bridge1004
        mac_address: 52:54:00:e6:22:c7
      - bridge: bridge1005
        mac_address: 52:54:00:e6:22:c8
  - hostname: router-test-2
    primary_bridge: bridge0
    management_mac: 52:58:00:54:b0:ac
    extra_nics:
      - bridge: bridge1005
        mac_address: 52:54:00:e6:22:d8
      - bridge: bridge1002
        mac_address: 52:54:00:e6:22:d9
    cloud_init_networks:
      - name: wan
        match_mac: 52:58:00:54:b0:ac
        set_name: wan
        dhcp4: true
      - name: transit
        match_mac: 52:54:00:e6:22:d8
        set_name: transit
        addresses:
          - 192.168.100.2/24
        optional: true
      - name: lan
        match_mac: 52:54:00:e6:22:d9
        set_name: lan
        addresses:
          - 192.168.102.1/24
        optional: true
  - hostname: router-peer-1
    primary_bridge: bridge0
    management_mac: 52:58:00:b7:53:07
    extra_nics:
      - bridge: bridge1004
        mac_address: 52:54:00:e6:22:e7
    cloud_init_networks:
      - name: wan
        match_mac: 52:58:00:b7:53:07
        set_name: wan
        dhcp4: true
      - name: lan
        match_mac: 52:54:00:e6:22:e7
        set_name: lan
        dhcp4: true
        routes:
          - to: 192.168.101.0/24
            via: 192.168.103.1
        optional: true
