---
- hosts: "{{ hypervisor_host | default(router_lab_hypervisor_host | default('ronny-1')) }}"
  vars_files:
    - ../vars/router-labs/common.yml
  vars:
    router_lab_machine_folder_default: /mnt/cheapo/machines/router_lab
  tasks:
    - name: normalize router lab topology
      set_fact:
        router_lab_effective_vms: >-
          {{
            router_lab_vms
              | default([
                  {
                    'hostname': test_vm_hostname | default('router-test-1')
                  }
                ])
          }}

    - name: validate router lab destroy targets
      ansible.builtin.assert:
        that:
          - router_lab_effective_vms | length > 0
          - router_lab_effective_vms | map(attribute='hostname') | list | select('match', '^router-(test|peer)-[0-9]+$') | list | length == (router_lab_effective_vms | length)
          - router_lab_effective_vms | map(attribute='hostname') | list | unique | length == (router_lab_effective_vms | length)
        fail_msg: >-
          Refusing to destroy non-router-lab VM names. Use a router-lab vars file
          with router-test-* or router-peer-* hostnames only.

    - name: destroy router lab guests
      include_role:
        name: lanefu.armlab.destroy_kvm_guest
      vars:
        destroy_item: "{{ item.hostname }}"
      loop: "{{ router_lab_effective_vms }}"
      loop_control:
        label: "{{ item.hostname }}"

    - name: remove stale router lab cloud-init seeds
      ansible.builtin.file:
        path: "{{ item.0.machine_folder | default(router_lab_machine_folder_default ~ '/' ~ item.0.hostname) }}/{{ item.1 }}"
        state: absent
      loop: "{{ query('nested', router_lab_effective_vms, ['network-config', 'user-data', 'meta-data']) }}"
      loop_control:
        label: "{{ item.0.hostname }}:{{ item.1 }}"

    - name: verify router lab cloud-init seeds are absent
      ansible.builtin.stat:
        path: "{{ item.0.machine_folder | default(router_lab_machine_folder_default ~ '/' ~ item.0.hostname) }}/{{ item.1 }}"
      loop: "{{ query('nested', router_lab_effective_vms, ['network-config', 'user-data', 'meta-data']) }}"
      loop_control:
        label: "{{ item.0.hostname }}:{{ item.1 }}"
      register: router_lab_seed_state

    - name: assert router lab cloud-init cleanup completed
      ansible.builtin.assert:
        that:
          - not item.stat.exists
        fail_msg: "router-lab cloud-init seed remains: {{ item.item.0.hostname }}/{{ item.item.1 }}"
      loop: "{{ router_lab_seed_state.results }}"
      loop_control:
        label: "{{ item.item.0.hostname }}:{{ item.item.1 }}"
